name: Phase 5 Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/phase5_scorecard.py
      - name: Start API for load test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/vera-uvicorn.log 2>&1 &
          sleep 2
      - run: python scripts/load_test.py --base-url http://127.0.0.1:8000 --requests 100 --workers 8
